<!doctype html>

<title>$title · KSE Touch</title><link rel="stylesheet" href="../../gallery.css"><link rel="stylesheet" href="../../../site-nav.css"><script defer src="../../preview.js"></script></head>
<body><header class="site-header"><a class="site-brand" href="../../../"><b>KSE</b><span>TOUCH <small>RADIO SETUP</small></span></a><nav class="site-nav" aria-label="KSE Touch"><a href="../../../">Installer</a><a href="../../" aria-current="page">Wallpapers &amp; images</a></nav></header>

<path d="M268.5 422v28m264-28v28" stroke="#5d6b79" stroke-opacity=".65"/>
<g fill="#fff" font-weight="bold" font-size="21" text-anchor="middle"><text x="138" y="444">RotorFlight</text><text x="400" y="444">Battery</text><text x="661" y="444">Tools</text></g>
</g></svg><figcaption id="caption">800 × 480 · KSE Touch Transparent mode · Sample electric dashboard and telemetry.</figcaption></figure>

<aside class="side"><h2>Download</h2><p class="meta">$dimensions px · PNG</p><a class="btn" href="$image" download>Download PNG ↓</a>

</main></body></html>
